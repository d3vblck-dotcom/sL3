#sL3
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev & Kalina: Cinematic Love Story</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0c0513; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        #menu, #hud { background: rgba(12, 5, 19, 0.9); color: #fff; padding: 22px; border-radius: 18px; border: 1px solid rgba(255,105,180,0.4); backdrop-filter: blur(12px); box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        #menu { max-width: 420px; margin: auto; text-align: center; }
        input, button { padding: 12px 20px; margin: 8px; border-radius: 10px; border: none; font-size: 16px; outline: none; }
        button { background: linear-gradient(135deg, #ff477e, #ff70a6); color: white; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(255,71,126,0.5); transition: 0.2s; }
        button:hover { transform: scale(1.06); }
        input { background: #1c0b2b; color: white; border: 1px solid #5a2c8a; width: 80%; text-align: center; letter-spacing: 2px; }
        #kiss-btn { display: none; position: absolute; bottom: 40px; right: 40px; width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #ff2060, #ff477e); color: white; font-size: 34px; border: 4px solid white; box-shadow: 0 8px 30px rgba(255,32,96,0.9); cursor: pointer; pointer-events: auto; transition: 0.2s; }
        #kiss-btn:active { transform: scale(0.9); }
        #cutscene-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,105,180,0.9) 0%, rgba(12,5,19,0.98) 100%); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; backdrop-filter: blur(8px); }
        #cutscene-overlay h1 { font-size: 46px; text-shadow: 0 4px 25px rgba(0,0,0,0.8); margin: 0 0 10px 0; }
        .heart { position: absolute; color: #ff477e; font-size: 28px; animation: floatUp 2s infinite ease-in; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-180px) scale(1.6); opacity: 0; } }
    </style>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <!-- Main Menu & Party Code System -->
        <div id="menu" class="interactive">
            <h2 style="color: #ff70a6; margin-top:0;">Dev & Kalina</h2>
            <p style="font-size: 14px; color: #d0bfff;">Enter a 4-digit room code to link your devices across distance.</p>
            <input type="text" id="code-input" placeholder="7777" maxlength="4"><br>
            <button onclick="createRoom()">Create Room (Dev)</button>
            <button onclick="joinRoom()">Join Room (Kalina)</button>
        </div>

        <!-- In-Game HUD -->
        <div id="hud" style="display: none;">
            <h3 id="act-title" style="margin: 0 0 5px 0; color: #ff70a6;">Act 1: The Symphony of Us</h3>
            <p id="objective" style="margin: 0; font-size: 13px; color: #d0bfff;">Phase 1: Explore together under the golden dusk. Use WASD/Arrows to walk.</p>
        </div>

        <!-- Anytime Kiss Button -->
        <button id="kiss-btn" onclick="triggerKiss()">💋</button>
    </div>

    <!-- Cinematic Kiss Cutscene Overlay -->
    <div id="cutscene-overlay">
        <h1>💕 Dev & Kalina 💕</h1>
        <p style="font-size: 22px; font-style: italic; color: #ffe6f2;">"Inseparable through every world."</p>
    </div>

    <script>
        let scene, camera, renderer, devGroup, kalinaGroup;
        let isConnected = false;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0513);
            scene.fog = new THREE.FogExp2(0x0c0513, 0.01);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 9);
            camera.lookAt(0, 1.2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Cinematic soft shadows
            document.body.appendChild(renderer.domElement);

            // AAA Lighting Setup (Sunset & Rim Glow)
            const ambientLight = new THREE.AmbientLight(0x2a1b3d, 1.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffa07a, 2.5);
            sunLight.position.set(20, 30, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const rimLight = new THREE.DirectionalLight(0xff477e, 1.2);
            rimLight.position.set(-20, 15, -20);
            scene.add(rimLight);

            // Detailed Ground Floor
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x160a24, roughness: 0.6, metalness: 0.3 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // --- DEV (5'10" Height Proportioned, Fair Complexion[cite: 5], Styled Dark Hair[cite: 5], Blue Shirt[cite: 5]) ---
            devGroup = new THREE.Group();
            // Torso
            const devTorso = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.1, 0.35), new THREE.MeshStandardMaterial({ color: 0x1b4965, roughness: 0.4 }));
            devTorso.position.y = 1.1; devTorso.castShadow = true; devGroup.add(devTorso);
            // Head (Fair skin[cite: 5])
            const devHead = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.4), new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.5 }));
            devHead.position.y = 1.85; devHead.castShadow = true; devGroup.add(devHead);
            // Voluminous Dark Messy Hair[cite: 5]
            const devHair = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.25, 0.48), new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.8 }));
            devHair.position.set(0, 2.1, 0); devGroup.add(devHair);
            devGroup.position.set(-2.5, 0, 0);
            scene.add(devGroup);

            // --- KALINA (5'4" Height Proportioned, Petite, Dark Hair[cite: 6], Gorgeous Aesthetic[cite: 6]) ---
            kalinaGroup = new THREE.Group();
            // Torso (Dark outfit[cite: 6])
            const kalinaTorso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.95, 0.3), new THREE.MeshStandardMaterial({ color: 0x221e22, roughness: 0.4 }));
            kalinaTorso.position.y = 0.95; kalinaTorso.castShadow = true; kalinaGroup.add(kalinaTorso);
            // Head
            const kalinaHead = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.35), new THREE.MeshStandardMaterial({ color: 0xe6b89c, roughness: 0.5 }));
            kalinaHead.position.y = 1.6; kalinaHead.castShadow = true; kalinaGroup.add(kalinaHead);
            // Long Dark Hair Framing Face[cite: 6]
            const kalinaHair = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.65, 0.45), new THREE.MeshStandardMaterial({ color: 0x140d08, roughness: 0.8 }));
            kalinaHair.position.set(0, 1.65, -0.05); kalinaGroup.add(kalinaHair);
            kalinaGroup.position.set(2.5, 0, 0);
            scene.add(kalinaGroup);

            animate();
        }

        function createRoom() {
            const code = document.getElementById('code-input').value;
            if(code.length !== 4) { alert("Please enter a 4-digit code!"); return; }
            startGame("Room " + code + " Created (Dev)");
        }

        function joinRoom() {
            const code = document.getElementById('code-input').value;
            if(code.length !== 4) { alert("Please enter a 4-digit code!"); return; }
            startGame("Room " + code + " Joined (Kalina)");
        }

        function startGame(statusText) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('kiss-btn').style.display = 'block';
            isConnected = true;
            init3D();
        }

        // Anytime Cinematic Kiss Cutscene Mechanic
        function triggerKiss() {
            const overlay = document.getElementById('cutscene-overlay');
            overlay.style.display = 'flex';
            
            // Glide characters together into a waist-hold embrace
            devGroup.position.x = -0.25;
            kalinaGroup.position.x = 0.25;
            devGroup.rotation.y = 0.4;
            kalinaGroup.rotation.y = -0.4;

            // Spawn floating hearts
            for(let i=0; i<8; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = (42 + Math.random() * 16) + '%';
                heart.style.bottom = '35%';
                heart.style.animationDuration = (1.0 + Math.random() * 1.2) + 's';
                overlay.appendChild(heart);
                setTimeout(() => heart.remove(), 2200);
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                devGroup.rotation.y = 0;
                kalinaGroup.rotation.y = 0;
            }, 3000);
        }

        // Keyboard Controls for Movement
        document.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            const speed = 0.35;
            if (e.key === 'ArrowLeft' || e.key === 'a') devGroup.position.x -= speed;
            if (e.key === 'ArrowRight' || e.key === 'd') devGroup.position.x += speed;
            if (e.key === 'ArrowUp' || e.key === 'w') devGroup.position.z -= speed;
            if (e.key === 'ArrowDown' || e.key === 's') devGroup.position.z += speed;
        });

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
